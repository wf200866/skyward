[device]
codename = "ossi"
brand = "OnePlus"
model = "OnePlus Ace Pro"
ab = true
soc = { hans = "第一代骁龙®8+移动平台", hant = "Snapdragon® 8+ Gen 1 行動平台", en = "Snapdragon® 8+ Gen 1 Mobile Platform" }
os_version_prop = "ro.build.version.oplusrom"

[display]
width = 1080
height = 2412
density = 480
diagonal = 6.7
corner_radius = 120

# The modules are all in the vendor partition and its vendor_dlkm twin, whose
# copies are byte for byte the same; the vendor_boot ramdisk holds only the
# six the second stage of boot needs (adsp_loader, gpr, q6_notifier, q6_pdr,
# snd_event, spf_core). A module named below is looked for in these in order,
# and its dependencies are read from that same folder's modules.dep.
[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# The touchscreen: Synaptics S3910 over SPI (990000.spi, spi0.0) behind
# OnePlus's TCM layer. modules.dep lists the five it rests on
# (oplus_bsp_fw_update, oplus_bsp_tp_custom, oplus_bsp_tp_notify,
# panel_event_notifier, olc), and they load first. It reports positions
# itself on "touchpanel" (input5, EV=b with ABS_MT), so nothing has to be
# told to it once the driver has made that device.
load = ["synaptics_tcm2"]

# The vibration motor: Qualcomm's haptics driver, whose own waveform plays
# nothing in a recovery. The motor swings at 171 Hz on this phone, which the
# driver reads as it boots; clicks are built from samples at that frequency
# instead.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }

# The firmware of the WLAN chip is on the modem partition, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted. The
# recovery's own vendor ramdisk carries the folder empty, with the modem
# image it should hold left out.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The secure world keeps its own files
# there, through a listener qseecomd registers: among them what the key
# service needs to use a key that cannot be rolled back, such as the one
# guarding each user's secret. The WLAN's MAC address is there as well.
[partitions]
mounted = ["persist"]

# What the phone's own init runs once the system has finished starting, as
# the user and in the groups its init script on the phone gives it.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# WLAN: Qualcomm's QCA6490 on PCIe (qcom,cnss-qca6490@b0000000), driven by
# qca_cld3_qca6490 over the cnss2 platform driver. Only the top of the chain
# is named: modules.dep has the fifteen it rests on (qmi_helpers,
# wlan_firmware_service, cnss_*, mhi, pci-msm-drv, qcom_*), and they load
# first. Once fs_ready is written, cnss2 powers the chip up, the loader reads
# its firmware from the modem partition (mounted below as /firmware), and
# wlan0 appears. Its settings and its address are links in the vendor
# partition's own firmware folder: the settings into /vendor/etc/wifi, the
# address into persist, which is why persist is mounted above.
[wlan]
modules = ["qca_cld3_qca6490"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater asks.
[update]
server = "https://component-ota-cn.allawntech.com/update/v6"

# The stock build the recovery is made on. The image is taken out of the
# package's recovery partition by `scripts/fetch-stock.py`, which lays it
# over the whole partition and adds the AVB footer the packer wants; that
# package's own file name says nothing of the build, so `path` is what the
# configuration names, and the packer reads the image from beside this file.
[stock]
version = "PMA110_16.0.8.304(CN01)"
path = "ossi-recovery.img"
package = "https://gauss-componentotacostmanual-cn.allawnfs.com/remove-e2ea197553fa1614f4c8920b7e42e9a5/component-ota/26/04/07/42be06b17cc1411287aeda3f549b3900.zip"
recovery = "76f40a2e7c9a42b22bccc292c5e12315b9668cdb793176d540777f39877666d0"

# The partitions a backup of the baseband and EFS takes: the baseband's
# settings, with the IMEI, and the sensors' calibration.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
]

# Where the phone's own programs keep logs in the data partition.
[wipe]
logs = [
    "/data/persist_log",
    "/data/vendor/diag",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]